name: Release

# Installers are built from a tag and from nothing else, so the artefacts on a
# release page always correspond to a commit someone named. `workflow_dispatch`
# builds the same four bundles and stops short of publishing, which is how a
# change to the packaging is tried before a version number is spent on it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    # Seconds, and it runs first: three bundle jobs are the best part of an
    # hour, and a tag that disagrees with the manifests would produce
    # installers whose file names lie about what is inside them.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          workspace=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          shell=$(grep -m1 '^version' crates/argos_ui/Cargo.toml | cut -d'"' -f2)
          test "$workspace" = "$shell" \
            || { echo "engine $workspace and shell $shell disagree"; exit 1; }
          if [ "${{ github.ref_type }}" = "tag" ]; then
            test "${GITHUB_REF_NAME#v}" = "$workspace" \
              || { echo "tag ${GITHUB_REF_NAME} does not name version $workspace"; exit 1; }
          fi
          echo "version=$workspace" >> "$GITHUB_OUTPUT"

  bundle:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: a bundle linked against the glibc of
          # 24.04 refuses to start on Debian 12 and on Ubuntu 22.04, which is
          # most of the machines that would install a .deb.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          # One .dmg for both Mac architectures, so nobody has to know which
          # machine they have. The engine is lipo'd below to match.
          - os: macos-latest
            target: universal-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/argos_ui
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/argos_ui/ui/package-lock.json

      - name: Web view toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
                                  libappindicator3-dev librsvg2-dev patchelf \
                                  libsoup-3.0-dev

      - name: Frontend dependencies
        working-directory: crates/argos_ui/ui
        run: npm ci

      # The engine is a separate binary in a separate workspace, and the shell
      # finds it beside itself at runtime. Building it here and staging it
      # under the name the bundler looks for is what puts it there.
      - name: Engine
        if: matrix.target != 'universal-apple-darwin'
        shell: bash
        run: |
          cargo build --release -p argos --target ${{ matrix.target }}
          mkdir -p crates/argos_ui/binaries
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/argos$ext" \
             "crates/argos_ui/binaries/argos-${{ matrix.target }}$ext"

      - name: Engine (universal)
        if: matrix.target == 'universal-apple-darwin'
        run: |
          cargo build --release -p argos --target x86_64-apple-darwin
          cargo build --release -p argos --target aarch64-apple-darwin
          mkdir -p crates/argos_ui/binaries
          lipo -create -output crates/argos_ui/binaries/argos-universal-apple-darwin \
            target/x86_64-apple-darwin/release/argos \
            target/aarch64-apple-darwin/release/argos

      # Both paths are given explicitly. The CLI otherwise finds them by
      # searching downwards from the working directory, and this project keeps
      # the Tauri config and the frontend in sibling directories rather than
      # in the layout that search expects.
      - name: Bundle
        working-directory: crates/argos_ui/ui
        env:
          TAURI_APP_PATH: ${{ github.workspace }}/crates/argos_ui
          TAURI_FRONTEND_PATH: ${{ github.workspace }}/crates/argos_ui/ui
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        # Signing goes here when there are certificates to sign with: Windows
        # wants `signCommand` in tauri.conf.json plus the certificate in a
        # secret, macOS wants APPLE_CERTIFICATE, APPLE_SIGNING_IDENTITY and the
        # notarisation credentials as environment variables on this step.

      - name: Collect
        shell: bash
        run: |
          mkdir -p installers
          find crates/argos_ui/target -path '*/release/bundle/*' -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*-setup.exe' -o -name '*.dmg' \) \
            -exec cp {} installers/ \;
          ls -l installers

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: installers/*
          if-no-files-found: error

  publish:
    needs: [version, bundle]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      # A forensic tool that cannot be verified after download is a strange
      # thing to ship, and the sums cost one line.
      - name: Checksums
        working-directory: staging
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: staging/*
          fail_on_unmatched_files: true
          generate_release_notes: true
