name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  miri:
    # `argos_device` is the only crate with `unsafe`, and each OS has its own
    # HAL — so each OS gets its own Miri run. The syscalls themselves are
    # unsupported under Miri and the platform tests that touch one are
    # `#[ignore]`d there; what this checks is the logic around them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly miri test -p argos_device

  cross-targets:
    # The three-OS matrix above is the real check, but it needs three runners
    # and the slowest of them gates the result. This lane type-checks every
    # HAL from one machine in seconds, so a change that breaks the Windows or
    # macOS build is reported before the matrix has finished booting.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Windows HAL
        run: cargo clippy -p argos_device --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: macOS HAL
        run: cargo clippy -p argos_device --all-targets --target aarch64-apple-darwin -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  feature-powerset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-hack --locked
      - run: cargo hack --feature-powerset check --workspace

  udeps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-udeps --locked
      - run: cargo +nightly udeps --workspace --all-targets

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - name: Seed corpora
        # The seeds are derived from the fixture builders, so they are generated
        # here rather than committed: a versioned copy drifts from its generator
        # silently, because libFuzzer accepts any bytes as a seed
        # (A-SUPPORT-DECLARED).
        run: |
          cargo run -p argos_carve --example gen_fuzz_corpus
          cargo run -p argos_fs --example gen_fuzz_corpus
      - name: Fuzz crates build
        # The fuzz crates are outside the workspace, so clippy and test do
        # not cover them; a target that stopped compiling would otherwise be
        # silently skipped.
        run: |
          cargo +nightly fuzz check -Zbuild-std --manifest-path crates/argos_carve/fuzz/Cargo.toml 2>/dev/null \
            || cargo +nightly fuzz build --fuzz-dir crates/argos_carve/fuzz
          cargo +nightly fuzz build --fuzz-dir crates/argos_fs/fuzz
      - name: Run every carving fuzz target for a fixed budget
        working-directory: crates/argos_carve
        run: |
          for target in jpeg_validate png_validate exif_thumbnail exif_metadata \
                        carver_scan block_classify reassemble_bifragment \
                        jpeg_entropy_scan decode_rgba reference_read; do
            cargo +nightly fuzz run "$target" -- -max_total_time=120 -rss_limit_mb=2048
          done
      - name: Run every filesystem fuzz target for a fixed budget
        working-directory: crates/argos_fs
        run: |
          for target in part_scan ntfs_record ext4_parse fat_dir apfs_open btrfs_parse residue_sweep; do
            cargo +nightly fuzz run "$target" -- -max_total_time=120 -rss_limit_mb=2048
          done

  triage-thresholds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Triage is deterministic statistics, and every threshold in it is a
      # number on a scale. This runs the harness that derives them, over a
      # range of the corpus generator disjoint from the one that grades them,
      # so a change to a rule shows its distributions in the log rather than
      # being taken on trust (A-EVAL-GATED).
      - name: The thresholds' distributions are recorded
        run: >
          cargo test -p argos_classify --features test-util --test thresholds
          -- --ignored --nocapture

  shell:
    # `argos_ui` is excluded from the engine's workspace, so nothing above
    # builds it. This lane is the only thing that does: the Rust side of the
    # shell, the frontend's type check, and the production bundle.
    #
    # Three runners, because how the shell obtains privileges differs per
    # platform and each way is written in code that only its own target
    # compiles. On one runner the other two would first be compiled by a
    # release, which is the worst moment to find out.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/argos_ui
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/argos_ui/ui/package-lock.json
      - name: Web view toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
                                  libappindicator3-dev librsvg2-dev patchelf \
                                  libsoup-3.0-dev
      - name: Frontend types
        working-directory: crates/argos_ui/ui
        run: |
          npm ci
          npm run check
      - name: Frontend bundle
        working-directory: crates/argos_ui/ui
        run: npm run build
      - name: Engine, staged where the bundler looks for it
        # `externalBin` is checked by `tauri-build`, so the shell does not
        # compile at all without the engine binary beside it. That is the
        # arrangement the installed application relies on, and building the
        # two together is what keeps it true.
        shell: bash
        run: |
          cargo build -p argos
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mkdir -p crates/argos_ui/binaries
          cp "target/debug/argos$ext" "crates/argos_ui/binaries/argos-$triple$ext"
      - name: Shell
        working-directory: crates/argos_ui
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  bundle:
    # The installers are only ever built from a tag, so without this the whole
    # packaging chain — sidecar, icons, polkit file, bundler configuration —
    # would go unexercised until the moment it is needed. One .deb is enough to
    # prove the chain; the other two formats differ only in the bundler.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/argos_ui
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/argos_ui/ui/package-lock.json
      - name: Web view toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
                                  libappindicator3-dev librsvg2-dev patchelf \
                                  libsoup-3.0-dev
      - name: Frontend dependencies
        working-directory: crates/argos_ui/ui
        run: npm ci
      - name: Engine, staged where the bundler looks for it
        run: |
          cargo build --release -p argos --target x86_64-unknown-linux-gnu
          mkdir -p crates/argos_ui/binaries
          cp target/x86_64-unknown-linux-gnu/release/argos \
             crates/argos_ui/binaries/argos-x86_64-unknown-linux-gnu
      - name: Bundle
        working-directory: crates/argos_ui/ui
        env:
          TAURI_APP_PATH: ${{ github.workspace }}/crates/argos_ui
          TAURI_FRONTEND_PATH: ${{ github.workspace }}/crates/argos_ui/ui
        run: npx tauri build --target x86_64-unknown-linux-gnu --bundles deb
      - name: The engine ships beside the shell
        # What `Engine::locate` depends on: the two binaries in one directory.
        # A packaging change that separated them would install a window that
        # cannot start a scan.
        run: |
          deb=$(find crates/argos_ui/target -name '*.deb' | head -1)
          dpkg-deb -c "$deb"
          dpkg-deb -c "$deb" | grep -qE ' usr/bin/argos-shell$'
          dpkg-deb -c "$deb" | grep -qE ' usr/bin/argos$'
          dpkg-deb -c "$deb" | grep -qE 'org\.argos\.shell\.policy$'

  ipc-bindings:
    # The wire format has one definition, in `argos_ipc`, and the frontend's
    # `dto.ts` is generated from it. A checkout where the two disagree is one
    # where a field was renamed in Rust and the shell still reads the old name
    # — which fails at runtime, in the web view, with no type error anywhere
    # (`A-DTO-VERSIONED`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate the TypeScript definitions
        run: cargo test -p argos_ipc --features bindings
      - name: They match what is checked in
        run: git diff --exit-code crates/argos_ui/ui/src/lib/dto.ts

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Benchmarks are not timed in CI — a shared runner's numbers mean
      # nothing — but they must keep compiling, or they rot until the next
      # time someone needs to measure something.
      - run: cargo bench --workspace --no-run

  guidelines-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rule ids are unique and counts match the index
        run: |
          test -z "$(grep -rhoE '^## .*\((M-[A-Z0-9-]+)\)' .claude/skills/*/reference.md | grep -oE 'M-[A-Z0-9-]+' | sort | uniq -d)"
          test "$(grep -rhoE '^## .*\((M-[A-Z0-9-]+)\)' .claude/skills/*/reference.md | wc -l)" = 89
          test -z "$(grep -rhoE '^## .*\((A-[A-Z0-9-]+)\)' .claude/skills/*/reference.md | grep -oE 'A-[A-Z0-9-]+' | sort | uniq -d)"
          test "$(grep -rhoE '^## .*\((A-[A-Z0-9-]+)\)' .claude/skills/*/reference.md | wc -l)" = 23
