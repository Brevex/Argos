name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly miri test -p argos_device

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  feature-powerset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-hack --locked
      - run: cargo hack --feature-powerset check --workspace

  udeps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-udeps --locked
      - run: cargo +nightly udeps --workspace --all-targets

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz crates build
        # The fuzz crates are outside the workspace, so clippy and test do
        # not cover them; a target that stopped compiling would otherwise be
        # silently skipped.
        run: |
          cargo +nightly fuzz check -Zbuild-std --manifest-path crates/argos_carve/fuzz/Cargo.toml 2>/dev/null \
            || cargo +nightly fuzz build --fuzz-dir crates/argos_carve/fuzz
          cargo +nightly fuzz build --fuzz-dir crates/argos_fs/fuzz
      - name: Run every carving fuzz target for a fixed budget
        working-directory: crates/argos_carve
        run: |
          for target in jpeg_validate png_validate exif_thumbnail carver_scan; do
            cargo +nightly fuzz run "$target" -- -max_total_time=120 -rss_limit_mb=2048
          done
      - name: Run every filesystem fuzz target for a fixed budget
        working-directory: crates/argos_fs
        run: |
          for target in part_scan ntfs_record ext4_parse fat_dir apfs_open residue_sweep; do
            cargo +nightly fuzz run "$target" -- -max_total_time=120 -rss_limit_mb=2048
          done

  guidelines-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rule ids are unique and counts match the index
        run: |
          test -z "$(grep -rhoE '^## .*\((M-[A-Z0-9-]+)\)' .claude/skills/*/reference.md | grep -oE 'M-[A-Z0-9-]+' | sort | uniq -d)"
          test "$(grep -rhoE '^## .*\((M-[A-Z0-9-]+)\)' .claude/skills/*/reference.md | wc -l)" = 89
          test -z "$(grep -rhoE '^## .*\((A-[A-Z0-9-]+)\)' .claude/skills/*/reference.md | grep -oE 'A-[A-Z0-9-]+' | sort | uniq -d)"
          test "$(grep -rhoE '^## .*\((A-[A-Z0-9-]+)\)' .claude/skills/*/reference.md | wc -l)" = 18
