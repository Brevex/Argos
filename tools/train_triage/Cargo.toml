# The training pipeline lives outside the workspace on purpose: only the
# pinned model artifact and the eval harness enter the repo (A-EVAL-GATED).
[package]
name = "train_triage"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
argos_classify = { path = "../../crates/argos_classify", features = ["test-util"] }
argos_core = { path = "../../crates/argos_core" }
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
sha2 = "0.10"

[profile.release]
debug = 1
