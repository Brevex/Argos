# Run by the `fuzz` lane in .github/workflows/ci.yml; proves every parser here
# returns errors on hostile input rather than panicking (A-FUZZ-EVERY-PARSER).
# `corpus/` holds the authored seeds `cargo run -p argos_carve --example
# gen_fuzz_corpus` writes, one per case, and nothing else (A-SUPPORT-DECLARED).

[package]
name = "argos_carve-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
argos_carve = { path = ".." }
argos_core = { path = "../../argos_core" }

[[bin]]
name = "jpeg_validate"
path = "fuzz_targets/jpeg_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "png_validate"
path = "fuzz_targets/png_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exif_thumbnail"
path = "fuzz_targets/exif_thumbnail.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exif_metadata"
path = "fuzz_targets/exif_metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "carver_scan"
path = "fuzz_targets/carver_scan.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "block_classify"
path = "fuzz_targets/block_classify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reassemble_bifragment"
path = "fuzz_targets/reassemble_bifragment.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jpeg_entropy_scan"
path = "fuzz_targets/jpeg_entropy_scan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_rgba"
path = "fuzz_targets/decode_rgba.rs"
test = false
doc = false
