[package]
name = "argos_device"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Mocked device core and shared fixtures; production builds cannot reach them.
test-util = ["argos_core/test-util"]

[dependencies]
argos_core.workspace = true

# The platform HALs. Each OS pulls in only what its own syscalls need; nothing
# platform-specific reaches the rest of the workspace (`M-OOBE`).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
argos_device = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[lints]
workspace = true
