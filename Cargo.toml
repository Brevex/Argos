[workspace]
resolver = "3"
members = ["crates/*"]
# `argos_ui` is a crate of this project but not a member of this workspace.
# The Tauri dependency tree is an order of magnitude larger than the engine's
# and would otherwise decide the outcome of `cargo audit`, `cargo udeps`,
# `feature-powerset` and `clippy::cargo/multiple_crate_versions` for code that
# reads evidence. It builds in a CI lane of its own.
exclude = [
    "crates/argos_carve/fuzz",
    "crates/argos_fs/fuzz",
    "crates/argos_ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
argos_carve = { path = "crates/argos_carve", version = "0.1.0" }
argos_classify = { path = "crates/argos_classify", version = "0.1.0" }
argos_core = { path = "crates/argos_core", version = "0.1.0" }
argos_device = { path = "crates/argos_device", version = "0.1.0" }
argos_engine = { path = "crates/argos_engine", version = "0.1.0" }
argos_fs = { path = "crates/argos_fs", version = "0.1.0" }
argos_ipc = { path = "crates/argos_ipc", version = "0.1.0" }
argos_report = { path = "crates/argos_report", version = "0.1.0" }

anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crc32fast = "1.5.1"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }
crossbeam-channel = "0.5.16"
libc = "0.2.189"
memchr = "2.8.3"
mimalloc = "0.1.52"
miniz_oxide = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
ts-rs = { version = "12.0.1", default-features = false }
windows-sys = { version = "0.61.2", default-features = false }
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }
zune-png = { version = "0.5.2", default-features = false, features = ["std"] }

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Additional lints are from the `restriction` and `nursery` group that prevent specific
# constructs being used in source code in order to drive up consistency,
# quality, and brevity
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"

# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"

# Benchmarks are profiled, and a profile without symbols is not actionable
# (`M-HOTPATH`).
[profile.bench]
debug = 1
