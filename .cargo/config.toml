# target-cpu floor chosen so release builds vectorize signature scanning while still
# running on any x86-64 CPU from ~2009 onward (M-TARGET-CPU); revisit per M-HOTPATH data.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v2"]
